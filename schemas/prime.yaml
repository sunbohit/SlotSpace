name: prime
version: 0.1.0
value_types:
  anatomy: {mask: "[anatomy]"}
  biological_process: {mask: "[biological_process]"}
  cellular_component: {mask: "[cellular_component]"}
  disease: {mask: "[disease]"}
  drug: {mask: "[drug]"}
  effect_phenotype: {mask: "[effect_phenotype]"}
  exposure: {mask: "[exposure]"}
  gene_protein: {mask: "[gene_protein]"}
  molecular_function: {mask: "[molecular_function]"}
  pathway: {mask: "[pathway]"}
doc_types:
  - anatomy
  - biological_process
  - cellular_component
  - disease
  - drug
  - effect_phenotype
  - exposure
  - gene_protein
  - molecular_function
  - pathway
conventions:
  normalization: NFKC, lowercase, collapse whitespace, strip boundary punctuation
  min_name_chars: 3
  target_mask: "[TARGET:<type>]"
  ambiguous_target_mask: "[TARGET]"
  self_mask: "[SELF:<doc_type>]"
  answer_phrases:
    anatomy: [anatomical structures, tissues, organs]
    biological_process: [biological processes, cellular processes, physiological processes]
    cellular_component: [cellular components, cellular structures, cell compartments]
    disease: [diseases, conditions, disorders]
    drug: [drugs, medications, compounds]
    effect_phenotype: [phenotypes, effects, symptoms]
    exposure: [exposures, environmental factors, environmental exposures]
    gene_protein: [genes, proteins, gene products]
    molecular_function: [molecular functions, molecular activities, biochemical functions]
    pathway: [pathways, biological pathways, molecular pathways]
none:
  anatomy: The anatomical structure is mentioned without specifying a schema relation.
  biological_process: The biological process is mentioned without specifying a schema relation.
  cellular_component: The cellular component is mentioned without specifying a schema relation.
  disease: The disease is mentioned without specifying a schema relation.
  drug: The drug is mentioned without specifying a schema relation.
  effect_phenotype: The effect or phenotype is mentioned without specifying a schema relation.
  exposure: The exposure is mentioned without specifying a schema relation.
  gene_protein: The gene or protein is mentioned without specifying a schema relation.
  molecular_function: The molecular function is mentioned without specifying a schema relation.
  pathway: The pathway is mentioned without specifying a schema relation.
cue_families:
  expression_absent: &expression_absent
    relation: expression absent
    direction: out
    query_cues: [not expressed, absent expression, no detectable expression]
    doc_cues: [not expressed, expression is absent, undetectable expression]
  expression_present: &expression_present
    relation: expression present
    direction: out
    query_cues: [expressed in, expression of, detectable expression]
    doc_cues: [expressed in, expression is present, detected in]
  parent_child: &parent_child
    relation: parent-child
    direction: sym
    query_cues: [subtype of, broader or narrower, parent category]
    doc_cues: [subclass of, parent category, hierarchical relationship]
  interacts_with: &interacts_with
    relation: interacts with
    direction: out
    query_cues: [involved in, interacts with, participates in]
    doc_cues: [involved in, interacts with, functionally related to]
  associated_with: &associated_with
    relation: associated with
    direction: out
    query_cues: [associated with, genetically linked to, associated genes]
    doc_cues: [associated with, genetic association, implicated in]
  contraindication: &contraindication
    relation: contraindication
    direction: out
    query_cues: [should be avoided, contraindicated in, must not be used]
    doc_cues: [contraindicated in, should not be given, avoid use]
  indication: &indication
    relation: indication
    direction: out
    query_cues: [used to treat, prescribed for, indicated for]
    doc_cues: [indicated for, used to treat, approved for treatment]
  linked_to: &linked_to
    relation: linked to
    direction: out
    query_cues: [linked exposure, exposure linked to, environmental risk factor]
    doc_cues: [exposure linked to, environmental association, associated exposure]
  off_label: &off_label
    relation: off-label use
    direction: out
    query_cues: [off-label, without formal approval, unapproved use]
    doc_cues: [off-label use, used off-label, not formally approved]
  phenotype_absent: &phenotype_absent
    relation: phenotype absent
    direction: out
    query_cues: [phenotype absent, does not show, lacks the phenotype]
    doc_cues: [phenotype is absent, not observed in the disease, does not exhibit]
  phenotype_present: &phenotype_present
    relation: phenotype present
    direction: out
    query_cues: [shows the phenotype, exhibits the symptom, phenotype present]
    doc_cues: [phenotype is present, presents with, exhibits the phenotype]
  carrier: &carrier
    relation: carrier
    direction: out
    query_cues: [carrier protein, carries the drug, carried by]
    doc_cues: [carrier of, drug carrier, carried by the protein]
  enzyme: &enzyme
    relation: enzyme
    direction: out
    query_cues: [metabolized by, metabolizes the drug, metabolic enzyme]
    doc_cues: [metabolized by, metabolizing enzyme, catalyzes drug metabolism]
  side_effect: &side_effect
    relation: side effect
    direction: out
    query_cues: [side effect, adverse effect, can cause]
    doc_cues: [side effect, adverse reaction, causes the phenotype]
  synergistic: &synergistic
    relation: synergistic interaction
    direction: sym
    query_cues: [synergistic with, drug synergy, synergistic interaction]
    doc_cues: [synergistic with, synergistic effect, acts synergistically]
  target: &target
    relation: target
    direction: out
    query_cues: [targets the protein, molecular target, targeted by]
    doc_cues: [molecular target, binds to its target, targeted by the drug]
  transporter: &transporter
    relation: transporter
    direction: out
    query_cues: [transported by, transports the drug, drug transporter]
    doc_cues: [transported by, drug transport, transporter protein]
  ppi: &ppi
    relation: ppi
    direction: sym
    query_cues: [protein interaction, physically interacts, protein binding partner]
    doc_cues: [physical interaction, protein binding partner, interacts with the protein]
