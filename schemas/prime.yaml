    value_type: gene_protein
    n_edges: 1518203
    description: The gene or protein is expressed in this anatomical structure.
  - id: anatomy.parent_child.anatomy
    <<: *parent_child
    doc_type: anatomy
    value_type: anatomy
    n_edges: 28064
    description: The anatomical structure has a broader or narrower hierarchical relationship with the other structure.
  - id: biological_process.interacts_with.exposure
    <<: *interacts_with
    doc_type: biological_process
    value_type: exposure
    n_edges: 1625
    description: The biological process is functionally connected to the exposure.
  - id: biological_process.interacts_with.gene_protein
